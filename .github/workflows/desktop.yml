name: Desktop checks and packages
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cube-controller
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cube-controller/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke
      - run: node scripts/package.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: cube-controller-${{ matrix.target }}
          path: |
            cube-controller/release/*.exe
            cube-controller/release/*.dmg
            cube-controller/release/*.zip
